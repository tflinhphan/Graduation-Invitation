<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <!-- Background Card -->
  <rect x="15" y="30" width="270" height="350" rx="15" fill="#ffffff" stroke="none"/>
  
  <!-- Outer Wavy Border (Doodle style) -->
  <path d="
    M 20,40 
    C 25,35 35,35 40,40 C 45,45 55,45 60,40 C 65,35 75,35 80,40 C 85,45 95,45 100,40 C 105,35 115,35 120,40 C 125,45 135,45 140,40 C 145,35 155,35 160,40 C 165,45 175,45 180,40 C 185,35 195,35 200,40 C 205,45 215,45 220,40 C 225,35 235,35 240,40 C 245,45 255,45 260,40 C 265,35 275,35 280,40
    C 285,45 285,55 280,60 C 275,65 275,75 280,80 C 285,85 285,95 280,100 C 275,105 275,115 280,120 C 285,125 285,135 280,140 C 275,145 275,155 280,160 C 285,165 285,175 280,180 C 275,185 275,195 280,200 C 285,205 285,215 280,220 C 275,225 275,235 280,240 C 285,245 285,255 280,260 C 275,265 275,275 280,280 C 285,285 285,295 280,300 C 275,305 275,315 280,320 C 285,325 285,335 280,340 C 275,345 275,355 280,360 C 285,365 285,375 280,380
    C 275,385 265,385 260,380 C 255,375 245,375 240,380 C 235,385 225,385 220,380 C 215,375 205,375 200,380 C 195,385 185,385 180,380 C 175,375 165,375 160,380 C 155,385 145,385 140,380 C 135,375 125,375 120,380 C 115,385 105,385 100,380 C 95,375 85,375 80,380 C 75,385 65,385 60,380 C 55,375 45,375 40,380 C 35,385 25,385 20,380
    C 15,375 15,365 20,360 C 25,355 25,345 20,340 C 15,335 15,325 20,320 C 25,315 25,305 20,300 C 15,295 15,285 20,280 C 25,275 25,265 20,260 C 15,255 15,245 20,240 C 25,235 25,225 20,220 C 15,215 15,205 20,200 C 25,195 25,185 20,180 C 15,175 15,165 20,160 C 25,155 25,145 20,140 C 15,135 15,125 20,120 C 25,115 25,105 20,100 C 15,95 15,85 20,80 C 25,75 25,65 20,60 C 15,55 15,45 20,40
    Z" 
    fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner border (double frame effect) -->
  <path d="M 27,47 L 273,47 L 273,373 L 27,373 Z" fill="none" stroke="#222222" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- Ribbon/Bow at the top center -->
  <g transform="translate(150, 30)">
    <!-- Left loop -->
    <path d="M 0,0 C -15,-15 -25,-5 -20,5 C -15,12 -5,5 0,0" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right loop -->
    <path d="M 0,0 C 15,-15 25,-5 20,5 C 15,12 5,5 0,0" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Center knot -->
    <circle cx="0" cy="0" r="3.5" fill="#111111"/>
    <!-- Left tail -->
    <path d="M -2,2 C -8,12 -12,15 -15,20" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right tail -->
    <path d="M 2,2 C 8,12 12,15 15,20" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
